    <h3>Bits16</h3><a name="MARKER-2-66" id="MARKER-2-66"></a>The
    <code>Bits16</code> array is used by the <code>Cursor</code>
    record to hold a black-and-white, 16-by-16 pixel square image.
    <pre>
Bits16 = ARRAY[0..15] OF Integer;
</pre>
